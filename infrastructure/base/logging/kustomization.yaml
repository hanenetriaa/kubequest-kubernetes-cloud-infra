apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Logging stack (Loki + Promtail) is installed via Helm.
# Run install.sh to deploy using the values files in this directory.
#
# Components:
#   - Loki (single binary mode, 10Gi storage, 168h retention)
#   - Promtail (DaemonSet on all nodes)
#
# See: install.sh, loki-values.yaml, promtail-values.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: logging-helm-values
    namespace: logging
    files:
      - loki-values.yaml
      - promtail-values.yaml
