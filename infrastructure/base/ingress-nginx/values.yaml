controller:
  kind: DaemonSet

  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  nodeSelector:
    node-type: ingress

  tolerations:
    - key: node-type
      operator: Equal
      value: ingress
      effect: NoSchedule

  service:
    type: ClusterIP

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: kube-prometheus-stack

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  admissionWebhooks:
    enabled: true
    patch:
      nodeSelector:
        node-type: ingress
      tolerations:
        - key: node-type
          operator: Equal
          value: ingress
          effect: NoSchedule

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    log-format-upstream: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id'

defaultBackend:
  enabled: false
