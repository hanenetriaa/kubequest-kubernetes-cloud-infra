apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ingress-nginx is installed via Helm.
# Run install.sh to deploy using the values.yaml in this directory.
#
# Resources managed by Helm:
#   - ingress-nginx controller (DaemonSet)
#   - ingress-nginx admission webhooks
#
# See: install.sh, values.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: ingress-nginx-helm-values
    namespace: ingress-nginx
    files:
      - values.yaml
