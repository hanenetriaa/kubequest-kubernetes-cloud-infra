apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay for KubeQuest infrastructure.
# References all base components for the production cluster.
#
# Cluster topology:
#   - kube-1: control-plane + worker
#   - kube-2: application workloads (label: node-type=application)
#   - ingress: ingress-nginx (label: node-type=ingress, taint: node-type=ingress:NoSchedule)
#   - monitoring: prometheus/grafana/loki (label: node-type=monitoring, taint: node-type=monitoring:NoSchedule)

resources:
  - ../../base/namespaces
  - ../../base/dashboard
  - ../../base/security/opa

commonLabels:
  environment: production
  app.kubernetes.io/part-of: kubequest
  app.kubernetes.io/managed-by: kustomize
