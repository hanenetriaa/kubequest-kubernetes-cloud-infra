apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-app.fullname" . }}-config
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.env.APP_ENV | quote }}
  APP_DEBUG: {{ .Values.app.env.APP_DEBUG | quote }}
  DB_HOST: {{ tpl .Values.app.env.DB_HOST . | quote }}
  DB_PORT: {{ .Values.app.env.DB_PORT | quote }}
  DB_DATABASE: {{ .Values.app.env.DB_DATABASE | quote }}
  DB_CONNECTION: {{ .Values.app.env.DB_CONNECTION | quote }}
