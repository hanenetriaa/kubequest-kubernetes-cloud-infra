apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sample-app.fullname" . }}-secret
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ .Values.mysql.auth.password | b64enc | quote }}
  DB_USERNAME: {{ .Values.app.env.DB_USERNAME | b64enc | quote }}
  APP_KEY: {{ .Values.app.env.APP_KEY | b64enc | quote }}
