---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base layer: namespace + Helm chart rendered via kustomize --enable-helm
# Deploy: kubectl kustomize --enable-helm gitops/overlays/production | kubectl apply -f -
resources:
  - namespace.yaml

helmCharts:
  - name: sample-app
    releaseName: sample-app
    namespace: sample-app
    # Path relative to this kustomization.yaml
    chart: ../../charts/sample-app
    valuesFile: ../../charts/sample-app/values.yaml

commonLabels:
  app.kubernetes.io/part-of: sample-app
  app.kubernetes.io/managed-by: kustomize
