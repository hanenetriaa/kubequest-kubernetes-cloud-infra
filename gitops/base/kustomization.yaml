---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base layer: Kubernetes namespace for sample-app
#
# NOTE: Kustomize helmCharts doesn't support local file paths (only remote repos).
# For reproducible deployments with full app + MySQL + backups, use deploy-all.sh:
#
#   bash deploy-all.sh
#
# For alternative GitOps patterns, use Helm directly:
#
#   helm upgrade --install sample-app charts/sample-app -n sample-app --create-namespace \
#     --set mysql.auth.password=<PASSWORD> \
#     --set mysql.auth.rootPassword=<ROOT_PASSWORD>
#
# This Kustomization manages the shared namespace; app resources are deployed via Helm.

resources:
  - namespace.yaml

commonLabels:
  app.kubernetes.io/part-of: sample-app
  app.kubernetes.io/managed-by: kustomize
